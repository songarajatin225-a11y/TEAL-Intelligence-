<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEAL — Costing &amp; Estimation Platform</title>
  <meta name="description" content="Titan Engineering &amp; Automation Limited — costing, estimation and profitability platform.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="teal-app" id="app" data-theme="light">
    <aside class="rail" id="rail"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="sheet" id="sheet"></div>
    </div>
    <div id="notif"></div>
    <div id="modal"></div>
    <div id="palette"></div>
    <div id="toast"></div>
    <div class="boot" id="boot">
      <div>
        <div style="display:flex;align-items:center;gap:11px;justify-content:center">
          <svg viewBox="0 0 24 24" width="30" height="30" style="color:#0B6E75">
            <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2.2v19.6M2.2 12h19.6" stroke="currentColor" stroke-width=".9" opacity=".5"/>
            <path d="M12 12 L12 3.4 A8.6 8.6 0 0 1 20.6 12 Z" fill="currentColor" opacity=".92"/></svg>
          <div style="font-family:'IBM Plex Sans Condensed',system-ui;line-height:1.1">
            <b style="font-size:19px;letter-spacing:.04em">TEAL</b><br>
            <small style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C8C94">Costing &amp; Estimation Platform</small>
          </div>
        </div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
