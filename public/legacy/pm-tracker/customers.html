<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Customer and partner database with opportunities and interactions.">
<meta name="color-scheme" content="light dark">
<title>Customers · Laser Applications PM Tracker</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<script>
  /* Apply the saved theme before first paint to avoid a flash. */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('lpm.prefs') || '{}');
      var t = p.theme || 'system';
      if (t === 'system') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* defaults to light */ }
  })();
</script>
</head>
<body>

  <main class="main" id="main">
    <div class="page" id="pageRoot">

    </div>
  </main>
</div>

</html>
